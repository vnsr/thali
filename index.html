<html lang="en">

<meta name="mobile-web-app-capable" content="yes">

<title>Thali</title>
<style>
:root{--bg:#F6F3EC;--surface:#FFFFFF;--surface2:#EEE9DE;--ink:#1F1B15;--muted:#6E675B;--line:#E3DDD0;
--kcal:#D9661A;--pro:#2B8A5E;--carb:#3A76CF;--fat:#C0437A;--fib:#7B8A24;--water:#2394BE;--wt:#7A55C0;--danger:#C2392F;--ok:#2B8A5E;--on:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13110D;--surface:#1D1A15;--surface2:#29251E;--ink:#EDE8DE;--muted:#9C9484;--line:#332E26;
--kcal:#F08A3E;--pro:#4DBB89;--carb:#6C9DEB;--fat:#E173A2;--fib:#A9BA4A;--water:#4FB8DD;--wt:#A585E6;--danger:#F0685C;--ok:#4DBB89;--on:#13110D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13110D;--surface:#1D1A15;--surface2:#29251E;--ink:#EDE8DE;--muted:#9C9484;--line:#332E26;
--kcal:#F08A3E;--pro:#4DBB89;--carb:#6C9DEB;--fat:#E173A2;--fib:#A9BA4A;--water:#4FB8DD;--wt:#A585E6;--danger:#F0685C;--ok:#4DBB89;--on:#13110D;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--kcal);outline-offset:2px}
header.top{position:relative;flex:none;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px;display:flex;align-items:center;gap:10px}
.who{flex:1;min-width:0;text-align:left}.who h1{font-size:24px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15;display:flex;align-items:center;gap:4px}
.who h1 svg{width:18px;height:18px;color:var(--muted)}.who p{font-size:14px;color:var(--muted)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none;position:relative}
.icon-btn svg{width:20px;height:20px}
.icon-btn.alert::after{content:"";position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--danger);border:2px solid var(--bg)}
main{flex:1;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:4px max(16px,calc((100% - 528px)/2)) 28px}
nav.tabs{position:relative;flex:none;z-index:6;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
.tab svg{width:24px;height:24px}.tab.on{color:var(--ink);font-weight:600}
.tab.add{color:var(--on)}.tab.add span.plus{width:46px;height:46px;border-radius:50%;background:var(--kcal);display:grid;place-items:center;margin-top:-18px;box-shadow:0 4px 14px color-mix(in srgb,var(--kcal) 40%,transparent)}
.tab.add span.plus svg{width:26px;height:26px}.tab.add em{font-style:normal;color:var(--muted)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}
.datebar button.nav{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.datebar button.nav svg{width:18px;height:18px}.datebar button.nav:disabled{opacity:.35}
.datebar .dl{flex:1;text-align:center;font-weight:700;font-size:17px}.datebar .dl small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}.card h3 .r{margin-left:auto;font-weight:600;font-size:14px;color:var(--muted)}
.sum{display:flex;align-items:center;gap:14px}
.ring{width:132px;height:132px;flex:none}
.ring .trk{fill:none;stroke:var(--surface2);stroke-width:12}.ring .val{fill:none;stroke:var(--kcal);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .4s}
.ring .val.over{stroke:var(--danger)}.ring .big{fill:var(--ink);font-size:27px;font-weight:700;text-anchor:middle}.ring .sm{fill:var(--muted);font-size:12px;text-anchor:middle}
.sumtx{flex:1;min-width:0;display:grid;gap:7px}
.mac{font-size:13px}.mac .l{display:flex;justify-content:space-between;color:var(--muted)}.mac .l b{color:var(--ink);font-weight:600}
.bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;border-radius:4px;background:var(--c)}
.bar i.over{background:repeating-linear-gradient(45deg,var(--c),var(--c) 4px,color-mix(in srgb,var(--c) 55%,var(--surface)) 4px,color-mix(in srgb,var(--c) 55%,var(--surface)) 8px)}
.kline{display:flex;justify-content:space-around;text-align:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.kline div{font-size:12px;color:var(--muted)}.kline b{display:block;font-size:17px;color:var(--ink)}
.meal{padding:12px 14px 6px}
.meal-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.meal-h .mi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--kcal) 14%,var(--surface));color:var(--kcal);flex:none}
.meal-h .mi svg{width:18px;height:18px}.meal-h b{font-size:16px}.meal-h span{font-size:13px;color:var(--muted)}
.meal-h .t{margin-left:auto;font-weight:700;font-size:15px}.meal-h .plus{width:34px;height:34px;border-radius:50%;background:var(--kcal);color:var(--on);display:grid;place-items:center}
.meal-h .plus svg{width:18px;height:18px}
.ent{list-style:none}.ent li+li{border-top:1px solid var(--line)}
.ent button.row{width:100%;display:flex;align-items:center;gap:10px;padding:9px 0;text-align:left}
.ent .nm{flex:1;min-width:0}.ent .nm b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .nm small{color:var(--muted);font-size:13px}.ent .kc{font-weight:600;font-size:15px;white-space:nowrap}
.ghost{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 8px}
.chip{padding:7px 12px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}.chip.k{background:color-mix(in srgb,var(--kcal) 14%,var(--surface));color:var(--kcal)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}.chips.scroll::-webkit-scrollbar{display:none}
.water{display:flex;align-items:center;gap:10px}
.glasses{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.glass{width:22px;height:28px;border:2px solid var(--water);border-top:0;border-radius:0 0 7px 7px;position:relative;overflow:hidden;opacity:.55}
.glass.full{opacity:1}.glass.full::after{content:"";position:absolute;left:0;right:0;bottom:0;height:78%;background:var(--water)}
.rbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c);flex:none;font-weight:700;font-size:20px}
.rbtn svg{width:20px;height:20px}
.wrow{display:flex;align-items:center;gap:12px}.wrow .v{flex:1}.wrow .v b{font-size:20px}.wrow .v small{display:block;color:var(--muted);font-size:13px}
.btn{flex:1;padding:13px 10px;border-radius:14px;background:var(--surface2);font-weight:600;text-align:center;font-size:16px}
.btn.primary{background:var(--kcal);color:var(--on)}.btn.dark{background:var(--ink);color:var(--bg)}
.btn.small{flex:none;padding:9px 14px;font-size:15px}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.45}
.row-btns{display:flex;gap:8px}
.link{display:block;margin:10px auto 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted);font-size:14px}.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:15px}
.nudge{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px}.nudge span{flex:1}
.nudge.err{border-color:var(--danger);color:var(--danger)}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto}
.sheet.on{transform:none}.sheet.full{height:94vh;height:94dvh}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:none}
.sh-head{display:flex;align-items:center;gap:8px;padding:6px 16px 8px;flex:none}.sh-head h2{flex:1;font-size:19px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head .icon-btn{width:36px;height:36px}.sh-head .icon-btn svg{width:18px;height:18px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(18px + env(safe-area-inset-bottom,0px));flex:1}
.sh-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);flex:none}
.search{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.search .in{flex:1;position:relative}input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}.search input{width:100%;padding:11px 36px 11px 38px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none}
.search .in svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.search .clr svg{position:static;transform:none;width:16px;height:16px}
.search .icon-btn{width:44px;height:44px;border-radius:14px}
.res{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.res li+li{border-top:1px solid var(--line)}
.res button.it{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;text-align:left}
.res .nm{flex:1;min-width:0}.res .nm b{display:block;font-weight:600;font-size:15px;line-height:1.25}
.res .nm small{color:var(--muted);font-size:12.5px}.res .kc{font-weight:600;font-size:14px;white-space:nowrap;text-align:right}.res .kc small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.src{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:1px 6px;border-radius:6px;margin-right:5px;vertical-align:1px;background:var(--surface2);color:var(--muted)}
.src.my{background:color-mix(in srgb,var(--kcal) 16%,var(--surface));color:var(--kcal)}.src.th{background:color-mix(in srgb,var(--pro) 16%,var(--surface));color:var(--pro)}
.src.off{background:color-mix(in srgb,var(--carb) 16%,var(--surface));color:var(--carb)}.src.rc{background:color-mix(in srgb,var(--fat) 14%,var(--surface));color:var(--fat)}
.vdot{display:inline-block;width:11px;height:11px;border:1.5px solid var(--ok);border-radius:2px;position:relative;vertical-align:-1px;margin-right:4px}
.vdot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--ok)}.vdot.n{border-color:var(--danger)}.vdot.n::after{background:var(--danger)}.vdot.e{border-color:#C9A227}.vdot.e::after{background:#C9A227}
.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 6px;display:flex;align-items:center}
.sec .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
.big-k{text-align:center;margin:6px 0 4px}.big-k b{font-size:44px;font-weight:700;letter-spacing:-.02em;color:var(--kcal)}.big-k span{font-size:16px;color:var(--muted);margin-left:4px}
.m4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 14px}
.m4 div{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:7px 4px;text-align:center}
.m4 b{display:block;font-size:17px}.m4 span{font-size:11.5px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0}
.qty button{width:48px;height:48px;border-radius:50%;background:var(--surface2);font-size:24px;font-weight:600}
.qty input{width:110px;text-align:center;font-size:26px;font-weight:700;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.qty small{display:block;text-align:center;color:var(--muted)}
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tog{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.tog span{flex:1}.tog small{display:block;color:var(--muted);font-size:13px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--surface2);position:relative;flex:none;transition:background .15s;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw.on{background:var(--ok);border-color:var(--ok)}.sw.on::after{transform:translateX(20px)}
.set-sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 6px}
.list{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}.list button.it{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left}
.list .nm{flex:1;min-width:0}.list .nm small{display:block;color:var(--muted);font-size:13px}
.stack{display:flex;flex-wrap:wrap;gap:8px}
.ing{display:flex;align-items:center;gap:8px;padding:9px 12px}.ing .nm{flex:1;min-width:0}.ing .nm b{display:block;font-size:15px;font-weight:600}.ing .nm small{color:var(--muted);font-size:13px}
.ing input{width:76px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:right;font-size:16px}
.ing .x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}.ing .x svg{width:16px;height:16px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chart{width:100%;height:auto;display:block}.chart text{font-size:10px;fill:var(--muted)}
.chart .tl{stroke:var(--ink);stroke-dasharray:4 3;stroke-width:1.2;opacity:.65}.chart .gl{stroke:var(--line);stroke-width:1}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--muted)}.stat b{font-size:20px}.stat small{color:var(--muted);font-size:12px;margin-left:4px}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0 6px}.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cam{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:55vh;margin:0 auto 12px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;left:10%;right:10%;top:36%;height:28%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .line{position:absolute;left:14%;right:14%;top:50%;height:2px;background:#ff5a3c;animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(-34px)}50%{transform:translateY(34px)}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14.5px;font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:all .2s;max-width:calc(100vw - 32px);display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}.toast button{color:var(--kcal);font-weight:700;text-decoration:underline}
.addedbar{display:flex;align-items:center;gap:10px}.addedbar span{flex:1;font-size:14px;color:var(--muted)}.addedbar b{color:var(--ink)}
.star{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}.star.on{color:#E0A50C}.star svg{width:22px;height:22px}
.hint{font-size:12.5px;color:var(--muted);margin-top:-6px;margin-bottom:12px}
.warn{background:color-mix(in srgb,var(--danger) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--danger) 35%,var(--line));border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px;color:var(--muted);margin-bottom:12px}.calc b{color:var(--ink)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--kcal);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.foodlist .it .kc{min-width:58px}
.tab{position:relative}.tab .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--kcal);color:var(--on);font-size:11px;font-style:normal;font-weight:700;line-height:18px;text-align:center}
.addbox .in>svg{color:var(--kcal)}.addbox input{width:100%;padding:11px 12px 11px 38px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none}
.chips.sug{margin:-4px 0 8px}.chips.sug:empty{display:none}
.res.shop .srow{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 8px;min-height:50px}
.res.shop .srow .nm{flex:1;min-width:0;text-align:left;padding:8px 0}.res.shop .srow .nm b{display:block;font-weight:600;font-size:15.5px}.res.shop .srow .nm small{color:var(--muted);font-size:13px}

/* ---------- icons ---------- */

const I={

  sun:ic('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),

  camera:ic('<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>'),
  check:ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),

};
const MEALICON={b:I.sun,l:I.bowl,d:I.moon,s:I.apple};

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const today=()=>dayKey(Date.now());
const dayTs=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12).getTime();};
const addDay=(k,n)=>dayKey(dayTs(k)+n*864e5);
const monthOf=k=>k.slice(0,7);
const r0=x=>Math.round(x||0);
const r1=x=>Math.round((x||0)*10)/10;
const fmt=x=>String(Math.round(x||0));
const fmtG=x=>{x=x||0;return x<10?String(r1(x)).replace('.',','):String(Math.round(x));};
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:NaN;};
function dayLabel(k){
  const t=today();if(k===t)return 'Today';if(k===addDay(t,-1))return 'Yesterday';if(k===addDay(t,1))return 'Tomorrow';
  return new Date(dayTs(k)).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
const fullDate=k=>new Date(dayTs(k)).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const shortDate=k=>new Date(dayTs(k)).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
function toast(msg,undo){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':''}`;
  window._undo=undo||null;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),undo?5000:2400);
}
function vib(){try{navigator.vibrate&&navigator.vibrate(10);}catch(e){}}

/* ---------- state ---------- */
function blank(){return {v:1,
  settings:{device:'',theme:'auto',pid:'',hideNV:true,hideEgg:false,off:true,offDE:true,usdaKey:'',lastBackup:0,trendRange:7,foodsSeg:'mine',autoList:true},
  profiles:[],entries:[],foods:[],shop:[],pantry:[],
  sync:{repo:'',token:'',on:false,shas:{},dirty:{},last:0,err:''}};}
function hydrate(d){const b=blank();return {...b,...d,settings:{...b.settings,...(d.settings||{})},sync:{...b.sync,...(d.sync||{})},
  profiles:Array.isArray(d.profiles)?d.profiles:[],entries:Array.isArray(d.entries)?d.entries:[],foods:Array.isArray(d.foods)?d.foods:[],shop:Array.isArray(d.shop)?d.shop:[],pantry:Array.isArray(d.pantry)?d.pantry:[]};}
let S=blank(),IDB=null,storeMode='idb',saving=false,saveAgain=false;
const LSKEY='thali-state';
function idbOpen(){return new Promise((res,rej)=>{try{if(!window.indexedDB)return rej(new Error('none'));const r=indexedDB.open('thali',1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));}catch(e){rej(e);}});}
function idbGet(k){return new Promise((res,rej)=>{const q=IDB.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
function idbPut(k,v){return new Promise((res,rej)=>{const tx=IDB.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}
async function loadState(){
  try{IDB=await idbOpen();const d=await idbGet('state');if(d)return hydrate(d);return blank();}
  catch(e){storeMode='ls';IDB=null;try{const raw=localStorage.getItem(LSKEY);if(raw)return hydrate(JSON.parse(raw));}catch(_){}return blank();}
}
function saveLS(){try{localStorage.setItem(LSKEY,JSON.stringify(S));}catch(e){toast('This phone refused to save. Back up now.');}}
function save(){
  if(storeMode!=='idb'||!IDB)return saveLS();
  if(saving){saveAgain=true;return;}
  saving=true;let p;try{p=idbPut('state',S);}catch(e){p=Promise.reject(e);}
  p.then(()=>{saving=false;if(saveAgain){saveAgain=false;save();}}).catch(()=>{saving=false;storeMode='ls';saveLS();});
}
const prof=()=>S.profiles.find(p=>p.id===S.settings.pid&&!p.deleted)||S.profiles.find(p=>!p.deleted)||null;
const liveProfiles=()=>S.profiles.filter(p=>!p.deleted);

/* ---------- targets ---------- */
const ACTIVITY=[[1.2,'Sedentary','desk job, little exercise'],[1.375,'Lightly active','walks, exercise 1–3×/week'],[1.55,'Moderately active','exercise 3–5×/week'],[1.725,'Very active','hard exercise 6–7×/week'],[1.9,'Extra active','physical job + training']];
const GOALS=[[-0.5,'Lose 0.5 kg/week'],[-0.25,'Lose 0.25 kg/week'],[0,'Maintain weight'],[0.25,'Gain 0.25 kg/week']];
function latestWeight(p,upto){
  let best=null;for(const e of S.entries){if(e.deleted||e.type!=='weight'||e.pid!==p.id)continue;if(upto&&e.day>upto)continue;if(!best||e.day>best.day||(e.day===best.day&&e.ts>best.ts))best=e;}
  return best?best.kg:(p.weight||0);
}
function calcTargets(p,day){
  if(!p)return {k:2000,p:60,c:250,f:65,fi:30,w:2000,bmr:0,tdee:0,auto:true};
  const w=latestWeight(p,day)||70,h=p.height||170,age=Math.max(16,(new Date().getFullYear())-(p.birthYear||1990));
  const bmr=10*w+6.25*h-5*age+(p.sex==='f'?-161:5);
  const tdee=bmr*(p.activity||1.375);
  const adj=(p.goal||0)*7700/7; // kcal/day for kg/week
  let k=Math.round((tdee+adj+(+p.extraKcal||0))/10)*10;
  let pro=Math.round(w*(p.proteinPerKg||1.6));
  let fat=Math.round(k*((p.fatPct||30)/100)/9);
  let carb=Math.max(0,Math.round((k-pro*4-fat*9)/4));
  const out={k,p:pro,c:carb,f:fat,fi:p.fibre||30,w:p.water||2000,bmr:Math.round(bmr),tdee:Math.round(tdee),adj:Math.round(adj),weight:w,age,auto:true};
  if(p.manual&&p.manual.on){const m=p.manual;out.auto=false;
    if(m.k>0)out.k=+m.k;if(m.p>0)out.p=+m.p;if(m.f>0)out.f=+m.f;
    out.c=m.c>0?+m.c:Math.max(0,Math.round((out.k-out.p*4-out.f*9)/4));}
  return out;
}

/* ---------- entries ---------- */
const liveEntries=()=>S.entries.filter(e=>!e.deleted);
function dayEntries(day,pid){pid=pid||(prof()||{}).id;return S.entries.filter(e=>!e.deleted&&e.day===day&&e.pid===pid);}
function entN(e){const g=e.g||0;const n=e.n||[0,0,0,0,0];return [n[0]*g/100,n[1]*g/100,n[2]*g/100,n[3]*g/100,(n[4]||0)*g/100];}
function sumN(list){const t=[0,0,0,0,0];for(const e of list){if(e.type!=='food')continue;const n=entN(e);for(let i=0;i<5;i++)t[i]+=n[i];}return t;}
function touch(o){o.updatedAt=Date.now();o.by=S.settings.device||'';return o;}
function putEntry(e){touch(e);const i=S.entries.findIndex(x=>x.id===e.id);if(i<0)S.entries.push(e);else{const old=S.entries[i];if(monthOf(old.day)!==monthOf(e.day))markDirty(monthOf(old.day));S.entries[i]=e;}markDirty(monthOf(e.day));save();}
function delEntry(id,silent){
  const e=S.entries.find(x=>x.id===id);if(!e)return;const before={...e};
  e.deleted=true;touch(e);markDirty(monthOf(e.day));save();
  if(!silent)toast(`${e.type==='food'?e.name:e.type==='water'?'Water':'Weight'} deleted`,()=>{Object.assign(e,before,{deleted:false});touch(e);markDirty(monthOf(e.day));save();render();});
}
function entryLabel(e){
  if(e.u==='quick')return 'Quick add';
  if(e.u==='g'||!e.u)return `${fmtG(e.g)} g`;
  const q=e.q||1;return q===1?`${e.u} · ${fmtG(e.g)} g`:`${fmtG(q)} × ${e.u.replace(/^1 /,'')} · ${fmtG(e.g)} g`;
}
/* ---------- food database ----------
   Built-in files (cached for offline use by the service worker):
   data/foods-thali.json  curated everyday foods with Indian/German portions
   data/foods-indb.json   Indian Nutrient Databank recipes (implausible rows removed)
   data/foods-usda.json   USDA SR Legacy (public domain)
   Personal foods (my foods, recipes, scanned/online products) live in S.foods and sync. */
const SRC={c:['MY','my','My food'],r:['RECIPE','rc','My recipe'],o:['OFF','off','Open Food Facts'],f:['USDA','','USDA (online)'],t:['THALI','th','Thali list'],i:['INDB','','Indian Nutrient Databank'],u:['USDA','','USDA SR Legacy']};
const SRCW={c:0,r:0,o:12,f:22,t:8,i:20,u:30};
const DB=new Map();let dbReady={t:false,i:false,u:false},dbInfo={version:'',counts:{}};
const norm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u').replace(/[^a-z0-9]+/g,' ').trim();
function indexFood(f){
  const s=norm(f.name+' '+(f.brand||'')+' '+(f.al||''));
  f._s=' '+s+' ';f._t=s.split(' ');f._n=norm(f.name);
  f._raw=/\((raw|dry)\)|\braw\b|\bdry\b|unprepared/i.test(f.name);f._a=new Set([...String(f.al||'').split(','),...f.name.split('(')[0].split('/')].map(norm).filter(Boolean));
  return f;
}
function rowToFood(r){return indexFood({id:r[0],name:r[1],n:[r[2],r[3],r[4],r[5],r[6]],ps:r[7]||[],tags:r[8]||'',al:r[9]||'',cat:r[10]||'',src:r[0][0]});}
async function loadDbFile(key,fresh){
  const r=await fetch(`data/foods-${key}.json`,fresh?{cache:'no-store'}:{});if(!r.ok)throw new Error(r.status);
  const rows=await r.json();
  for(const id of [...DB.keys()])if(id[0]===key[0])DB.delete(id);
  for(const row of rows)DB.set(row[0],rowToFood(row));
  dbReady[key[0]]=true;
}
async function loadDb(fresh){
  try{const r=await fetch('data/db-version.json',fresh?{cache:'no-store'}:{});if(r.ok)dbInfo=await r.json();}catch(e){}
  await Promise.all([loadDbFile('thali',fresh).catch(()=>{}),loadDbFile('indb',fresh).catch(()=>{})]);
  if(sheetOpen())refreshSearch();
  loadDbFile('usda',fresh).then(()=>{if(sheetOpen())refreshSearch();}).catch(()=>{});
}
function personalFood(f){return indexFood({...f,src:f.kind==='recipe'?'r':f.kind==='off'?'o':f.kind==='usda'?'f':'c'});}
let PF=new Map();
function rebuildPersonal(){PF=new Map();for(const f of S.foods){if(!f.deleted)PF.set(f.id,personalFood(f));}}
function getFood(id){return PF.get(id)||DB.get(id)||null;}

/* search: every word must match the start of a word in the name/aliases (or, from 4 letters, appear inside).
   Common Indian/German words are expanded, e.g. "aloo" also finds potato, "dahi" finds yoghurt. */
const SYN={aloo:['potato'],alu:['potato'],bataka:['potato','aloo'],batata:['potato','aloo'],kartoffel:['potato'],chawal:['rice'],bhaat:['rice'],bhat:['rice'],reis:['rice'],
  dahi:['curd','yoghurt','yogurt'],curd:['dahi','yoghurt'],joghurt:['yoghurt','yogurt'],yogurt:['yoghurt'],yoghurt:['yogurt'],rotli:['roti','chapati'],chapati:['roti'],roti:['chapati'],
  gobi:['cauliflower'],gobhi:['cauliflower'],palak:['spinach'],matar:['peas'],mutter:['peas'],bhindi:['okra'],bhinda:['okra'],baingan:['eggplant','brinjal'],ringan:['eggplant','brinjal'],brinjal:['eggplant'],aubergine:['eggplant'],
  chana:['chickpea','chickpeas'],chole:['chickpea','chickpeas'],rajma:['kidney'],moong:['mung'],mung:['moong'],methi:['fenugreek'],lauki:['bottle gourd'],dudhi:['bottle gourd'],
  pyaz:['onion'],kanda:['onion'],dungli:['onion'],tamatar:['tomato'],tameta:['tomato'],gajar:['carrot'],kheera:['cucumber'],kakdi:['cucumber'],kela:['banana'],aam:['mango'],seb:['apple'],
  doodh:['milk'],dudh:['milk'],milch:['milk'],kase:['cheese'],kaese:['cheese'],brot:['bread'],ei:['egg'],eier:['egg'],anda:['egg'],apfel:['apple'],banane:['banana'],
  nusse:['nuts'],mandeln:['almonds'],badam:['almonds'],kaju:['cashew'],haferflocken:['oats'],hafer:['oat','oats'],nudeln:['pasta','noodles'],sahne:['cream'],malai:['cream'],zucker:['sugar'],chini:['sugar'],
  ol:['oil'],tel:['oil'],kichererbsen:['chickpeas'],linsen:['lentils'],bohnen:['beans'],gurke:['cucumber'],tomate:['tomato'],zwiebel:['onion'],karotte:['carrot'],mohre:['carrot'],
  erdbeeren:['strawberries'],heidelbeeren:['blueberries'],blaubeeren:['blueberries'],bier:['beer'],wein:['wine'],saft:['juice'],kaffee:['coffee'],tee:['tea'],chai:['tea'],
  wasser:['water'],hahnchen:['chicken'],murgh:['chicken'],fisch:['fish'],machli:['fish'],pilze:['mushroom'],champignons:['mushroom'],paprika:['pepper'],capsicum:['pepper'],spinat:['spinach'],
  erdnuss:['peanut'],mungfali:['peanut'],shing:['peanut'],wurst:['sausage'],schokolade:['chocolate'],kuchen:['cake'],keks:['biscuit','cookie'],brotchen:['roll'],semmel:['roll'],
  quark:['quark'],nimbu:['lemon'],zitrone:['lemon'],honig:['honey'],shahad:['honey'],ghee:['ghee','butter'],makhan:['butter'],tofu:['tofu'],soja:['soy','soya'],soya:['soy'],soy:['soya']};
function qTokens(q){return norm(q).split(' ').filter(Boolean).map(t=>[t,...(SYN[t]||[]).map(norm)]);}
function tokMatch(f,alts){ // returns penalty (lower = better) or -1 if no match; alts[0] is what was typed
  let best=-1;
  alts.forEach((a,i)=>{const syn=i>0?1.5:0;let m=-1;
    if(a.includes(' ')){if(f._s.includes(' '+a))m=1;}
    else{for(const t of f._t){if(t===a){m=0;break;}if(m<0&&t.startsWith(a))m=1;}
      if(m<0&&a.length>=4&&f._s.includes(a))m=3;}
    if(m>=0){m+=syn;if(best<0||m<best)best=m;}});
  return best;
}
function usageStats(pid){
  const m=new Map();const cut=addDay(today(),-90);
  for(const e of S.entries){if(e.deleted||e.type!=='food'||!e.fid||e.pid!==pid||e.day<cut)continue;const s=m.get(e.fid)||{n:0,last:''};s.n++;if(e.day>s.last)s.last=e.day;m.set(e.fid,s);}
  return m;

function visible(f){const st=S.settings;if(st.hideNV&&/n/.test(f.tags||''))return false;if(st.hideEgg&&/e/.test(f.tags||''))return false;return true;}
function searchFoods(q,limit=60,mode){
  const qt=qTokens(q);if(!qt.length)return [];
  const p=prof(),use=p?usageStats(p.id):new Map(),favs=new Set((p&&p.favs)||[]);
  const out=[];const qn=norm(q);
  const scan=f=>{
    if(!visible(f))return;let sc=0;
    for(const alts of qt){const m=tokMatch(f,alts);if(m<0)return;sc+=m*2;}
    if(f._a.has(qn))sc-=10;
    sc+=SRCW[f.src]||20;if(f._raw)sc+=mode==='recipe'?-3:12;
    if(f._n.startsWith(qn))sc-=8;else if(f._n.startsWith(qt[0][0]))sc-=4;
    sc+=Math.min(12,f._n.length/9);
    const u=use.get(f.id);if(u)sc-=Math.min(18,6+u.n*2);if(favs.has(f.id))sc-=14;
    out.push([sc,f]);
  };
  for(const f of PF.values())scan(f);
  for(const f of DB.values())scan(f);
  out.sort((a,b)=>a[0]-b[0]);
  const seen=new Set(),res=[];
  for(const [,f] of out){const key=f.src+'|'+f._n;if(seen.has(key))continue;seen.add(key);res.push(f);if(res.length>=limit)break;}
  return res;
}
/* closest matches: used when the full query finds little. Foods matching at least one meaningful word,
   ranked by how many words they match. */
const STOPW=new Set(['with','and','the','mit','und','von','aus','ohne','sweet','sweetened','plain','home','homemade','style','fresh','hot','cold','iced','big','small']);
function searchPartial(q,exclude,limit=8,mode){
  const qt=qTokens(q).filter(a=>a[0].length>=3&&!STOPW.has(a[0]));if(qt.length<1)return [];
  const out=[];
  const scan=f=>{if(!visible(f)||exclude.has(f.id))return;let hit=0,pen=0;
    for(const alts of qt){const m=tokMatch(f,alts);if(m>=0){hit++;pen+=m;}}
    if(!hit)return;
    let sc=(qt.length-hit)*14+pen*2+(SRCW[f.src]||20)+Math.min(12,f._n.length/9);if(f._raw)sc+=mode==='recipe'?-3:8;
    out.push([sc,f]);};
  for(const f of PF.values())scan(f);for(const f of DB.values())scan(f);
  out.sort((a,b)=>a[0]-b[0]);return out.slice(0,limit).map(x=>x[1]);
}

function offToFood(p,code){
  const nm=p.nutriments||{};
  let k=nm['energy-kcal_100g'];if(k==null&&nm['energy_100g']!=null)k=nm['energy_100g']/4.184;if(k==null&&nm['energy-kj_100g']!=null)k=nm['energy-kj_100g']/4.184;
  const name=(p.product_name_de||p.product_name||p.product_name_en||p.generic_name||'').trim();
  if(k==null||!name)return null;
  const ps=[];const sq=parseFloat(p.serving_quantity);
  if(sq>0&&sq<2000){const ss=String(p.serving_size||'').trim();ps.push([ss&&!/^\d+([.,]\d+)?\s*(g|ml)$/i.test(ss)?`1 serving (${ss})`.slice(0,40):'1 serving',Math.round(sq)]);}
  const pq=parseFloat(p.product_quantity);if(pq>0&&pq<=3000&&pq!==sq)ps.push(['1 pack',Math.round(pq)]);
  ps.push(['100 g',100]);
  const brand=String(p.brands||'').split(',')[0].trim();
  return {id:'o:'+(code||p.code),kind:'off',code:String(code||p.code||''),name,brand,
    n:[r1(k),r1(+nm.proteins_100g||0),r1(+nm.carbohydrates_100g||0),r1(+nm.fat_100g||0),r1(+nm.fiber_100g||0)],ps,tags:'',src:'o'};
}
const OFF_FIELDS='code,product_name,product_name_de,product_name_en,generic_name,brands,nutriments,serving_quantity,serving_size,product_quantity';
async function offProduct(code){
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
  if(r.status===404)return {missing:true};
  if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json();if(!j||j.status===0||!j.product)return {missing:true};
  const f=offToFood(j.product,code);return f?{food:f}:{missing:true,name:j.product.product_name||''};
}
async function offSearch(q){
  const mk=list=>list.map(p=>offToFood(p,p.code)).filter(Boolean).map(indexFood);
  const tries=[];
  const base=`https://search.openfoodfacts.org/search?page_size=30&langs=de,en&fields=${OFF_FIELDS}&q=`;
  if(S.settings.offDE)tries.push(base+encodeURIComponent(`${q} countries_tags:"en:germany"`));
  tries.push(base+encodeURIComponent(q));
  for(const u of tries){try{const r=await fetch(u);if(!r.ok)continue;const j=await r.json();const res=mk(j.hits||[]);if(res.length)return res;}catch(e){}}
  const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=30&fields=${OFF_FIELDS}`);
  if(!r.ok)throw new Error('http '+r.status);const j=await r.json();return mk(j.products||[]);
}
async function usdaSearch(q){
  const key=S.settings.usdaKey||'DEMO_KEY';
  const r=await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(key)}&query=${encodeURIComponent(q)}&pageSize=25&dataType=${encodeURIComponent('Foundation,SR Legacy,Survey (FNDDS)')}`);
  if(r.status===429)throw new Error('limit');if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json();
  return (j.foods||[]).map(x=>{
    const v=nr=>{const n=(x.foodNutrients||[]).find(a=>String(a.nutrientNumber)===nr);return n?+n.value:null;};
    let k=v('208');if(k==null)k=v('958');if(k==null)k=v('957');if(k==null&&v('268')!=null)k=v('268')/4.184;if(k==null)return null;
    const name=x.description.charAt(0)+x.description.slice(1).toLowerCase();
    return indexFood({id:'f:'+x.fdcId,kind:'usda',name,brand:'',n:[r1(k),r1(v('203')),r1(v('205')),r1(v('204')),r1(v('291'))],ps:[['100 g',100]],tags:/\b(chicken|beef|pork|fish|turkey|lamb|shrimp|tuna|salmon|ham|bacon|sausage)\b/i.test(name)?'n':'',src:'f'});
  }).filter(Boolean);
}

/* ingredient ideas for an estimate: for each meaningful word of the name, the best plain ingredients */
function estSuggest(){
  const words=norm(RC.name).split(' ').filter(w=>w.length>=3&&!STOPW.has(w));const have=new Set(RC.ings.map(x=>x.fid));const out=[],seen=new Set();
  for(const w of words){
    const hits=searchFoods(w,12,'recipe').filter(f=>(f.src==='t'||f.src==='c'||f.src==='o')&&!have.has(f.id)&&!seen.has(f.id)).slice(0,2);
    hits.forEach(f=>{seen.add(f.id);out.push(f);});
  }
  return out.slice(0,8);
}
function openRecipe(src){
  if(src&&src.src==='r'){const raw=S.foods.find(x=>x.id===src.id);RC={id:src.id,name:src.name,ings:(raw.ing||[]).map(x=>({...x})),yieldG:raw.yieldG||'',servings:raw.servings||2};}

  pushView(recipeView());

}

const stamp=()=>{const d=new Date();return `${dayKey(d)}_${pad(d.getHours())}${pad(d.getMinutes())}`;};
async function shareFile(name,text,mime){
  const file=new File([text],name,{type:mime});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true;}}catch(e){if(e&&e.name==='AbortError')return false;}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return true;
}
async function doBackup(){
  const body={app:'thali',kind:'backup',version:APP_VERSION,exportedAt:Date.now(),device:S.settings.device,profiles:S.profiles,entries:S.entries,foods:S.foods,shop:S.shop,pantry:S.pantry};
  const dev=(S.settings.device||'').replace(/[^\w-]+/g,'');
  if(await shareFile(`thali-backup-${stamp()}${dev?'-'+dev:''}.json`,JSON.stringify(body),'application/json')){S.settings.lastBackup=Date.now();save();toast('Backup ready');}
}
function mergeList(target,incoming,onChange){
  const idx=new Map(target.map((x,i)=>[x.id,i]));let n=0;
  for(const r of incoming||[]){if(!r||!r.id)continue;const i=idx.get(r.id);
    if(i==null){target.push(r);idx.set(r.id,target.length-1);n++;onChange&&onChange(null,r);}
    else if((r.updatedAt||0)>(target[i].updatedAt||0)){const old=target[i];target[i]=r;n++;onChange&&onChange(old,r);}}
  return n;
}
async function importFile(file){
  let d;try{d=JSON.parse(await file.text());}catch(e){return toast('That file is not a Thali backup.');}
  if(!d||d.app!=='thali')return toast('That file is not a Thali backup.');
  const a=mergeList(S.profiles,d.profiles),b=mergeList(S.entries,d.entries,(o,r)=>{markDirty(monthOf(r.day));if(o&&monthOf(o.day)!==monthOf(r.day))markDirty(monthOf(o.day));}),c=mergeList(S.foods,d.foods);
  const h=mergeList(S.shop,d.shop)+mergeList(S.pantry,d.pantry);
  if(a)markDirty('profiles');if(c)markDirty('foods');if(h)markDirty('household');
  if(!prof()&&liveProfiles().length)S.settings.pid=liveProfiles()[0].id;
  rebuildPersonal();save();closeSheet();toast(`Imported: ${a} profiles, ${b} entries, ${c} foods, ${h} list/pantry items updated`);
}
function exportCsv(){
  const q=v=>{v=String(v??'');return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const pn=Object.fromEntries(S.profiles.map(p=>[p.id,p.name]));
  const rows=[['date','profile','meal','item','amount','grams','kcal','protein_g','carbs_g','fat_g','fibre_g','water_ml','weight_kg']];
  for(const e of liveEntries().sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:a.ts-b.ts)){
    if(e.type==='food'){const n=entN(e);rows.push([e.day,pn[e.pid]||'',MEALNAME[e.meal]||'',e.name,entryLabel(e),e.u==='quick'?'':r1(e.g),r0(n[0]),r1(n[1]),r1(n[2]),r1(n[3]),r1(n[4]),'','']);}
    else if(e.type==='water')rows.push([e.day,pn[e.pid]||'','','Water','','','','','','','',e.ml,'']);
    else if(e.type==='weight')rows.push([e.day,pn[e.pid]||'','','Weight','','','','','','','','',e.kg]);
  }
  shareFile(`thali-export-${stamp()}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');

async function dbUpdate(){
  if(!navigator.onLine)return toast('You are offline.');
  toast('Checking for an update…');
  const before=dbInfo.version;
  try{await loadDb(true);}catch(e){return toast('Could not reach the app server.');}

/* ---------- automatic sync via a private GitHub repository ----------
   thali/YYYY-MM.json  entries of that month (all profiles)
   thali/profiles.json profiles and their targets/favourites
   thali/foods.json    own foods, recipes and saved products
   thali/household.json shopping list and pantry (shared by everyone)
   Pull: list folder, fetch only changed files, merge by id + updatedAt (deletions travel as flags).

/* recipe → shopping list */
const DESCR=/^(raw|dry|dried|fresh|whole|ripe|red|green|yellow|white|uncooked|unprepared|plain|regular|mature seeds|without salt|with salt|year round average|all varieties|commercial|home ?made|boiled|cooked|unenriched|enriched|peeled|unpeeled|with skin|without skin|edible portion)$/i;
function ingShopName(n){
  const s=String(n||'').replace(/\s*\((raw|dry|uncooked|cooked|boiled)\)/ig,'').trim();
  const c=s.split(',').map(x=>x.trim()).filter(Boolean);if(c.length<2)return cap(s);
  const rest=c.slice(1).filter(x=>!DESCR.test(x));
  return cap(rest.length?rest[0]+' '+c[0].toLowerCase():c[0]);
}
let RS=null;
function recipeShopView(raw){
  const ings=(raw.ing||[]).map(x=>({name:ingShopName(x.name),g:x.g}));

  return {full:true,html:()=>`${head('Shop for '+raw.name,{back:STACK.length>1})}<div class="sh-body">
    <p class="muted" style="margin-bottom:10px">Pick what you need to buy. Items already in stock in the pantry, or already on the list, start unticked.</p>

    </div><div class="sh-foot"><button class="btn primary" style="width:100%" data-act="rs-add">Add ${RS.items.filter(x=>x.on).length} to the list</button></div>`};

  'shop-seg':b=>{VIEW.shopSeg=b.dataset.s;render();},
  'shop-usual':b=>{addToList({name:b.dataset.n,qty:''});vib();renderShopKeepFocus('');},
  'shop-tick':b=>{const x=S.shop.find(i=>i.id===b.dataset.id);if(!x)return;x.done=!x.done;x.doneAt=x.done?Date.now():0;touch(x);vib();houseChanged();const y=$('#main').scrollTop;render();$('#main').scrollTop=y;},
  'shop-edit':b=>{const v=shopItemView('shop',b.dataset.id);if(v)pushView(v);},
  'shop-clear':()=>clearBought(),
  'shop-tickall':()=>{if(!confirm('Tick everything on the list?'))return;const t=Date.now();openShop().forEach(x=>{x.done=true;x.doneAt=t;touch(x);});houseChanged();render();},
  'shop-share':()=>shareList(),
  'pa-edit':b=>{const v=shopItemView('pantry',b.dataset.id);if(v)pushView(v);},
  'pa-cycle':b=>{const x=S.pantry.find(i=>i.id===b.dataset.id);if(!x)return;const nx={ok:'low',low:'out',out:'ok'}[x.state]||'ok';const added=setPantryState(x,nx);vib();
    const y=$('#main').scrollTop;render();$('#main').scrollTop=y;if(added)toast(`${x.name} added to the shopping list`);},
  'pa-filter':b=>{VIEW.paFilter=b.dataset.f;render();},
  'pa-listall':()=>{let n=0;for(const x of livePantry())if(x.state!=='ok'&&!onList(x.name)){addToList({name:x.name,qty:''},{cat:x.cat,src:'pantry'});n++;}render();toast(`${n} added to the shopping list`);},
  'se-cat':b=>{SE.cat=b.dataset.v;$$('[data-act="se-cat"]').forEach(x=>x.classList.toggle('on',x===b));},
  'se-state':b=>{SE.state=b.dataset.v;$$('[data-act="se-state"]').forEach(x=>x.classList.toggle('on',x===b));},
  'se-save':()=>seSave(),'se-del':()=>seDelete(),
  'se-topantry':()=>{const x=seRead();if(!x)return;S.pantry.push(touch({id:uid(),name:x.name,qty:'',cat:SE.cat,state:x.done?'ok':'low',exp:'',deleted:false}));houseChanged();toast(`${x.name} is now tracked in the pantry`);refreshView();},
  'se-tolist':()=>{const x=seRead();if(!x)return;addToList({name:x.name,qty:''},{cat:x.cat,src:'pantry'});toast(`${x.name} added to the shopping list`);refreshView();},
  'port-tolist':()=>{const f=PORT.f;const r=addToList({name:ingShopName(f.brand?f.name:f.name),qty:''});if(r)toast(r.dup?`${r.item.name} is already on the list`:`${r.item.name} added to the shopping list`);},
  'rs-open':b=>{const raw=S.foods.find(x=>x.id===b.dataset.id);if(!raw||!(raw.ing||[]).length)return toast('This recipe has no ingredients.');pushView(recipeShopView(raw));},
  'rs-tick':b=>{const x=RS.items[+b.dataset.i];x.on=!x.on;refreshView();},
  'rs-add':()=>recipeShopAdd(),
  't-autolist':b=>{S.settings.autoList=!S.settings.autoList;b.classList.toggle('on',S.settings.autoList);save();},
  'sync-on':()=>syncTurnOn(),'sync-off':()=>syncTurnOff(),'sync-now':()=>{autoSync();setSyncUI();},
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=A[b.dataset.act];if(f){e.preventDefault();f(b);}
});
$('#scrim').addEventListener('click',()=>closeSheet());
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f);});
$('#photoIn').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)scanPhoto(f);});
document.addEventListener('input',e=>{if(e.target.id==='dbq'){VIEW.dbq=e.target.value;clearTimeout(window._dbt);window._dbt=setTimeout(renderDbResults,120);}});
// swipe down on the sheet's top area to close
(()=>{let y0=null;const sh=$('#sheet');
  sh.addEventListener('touchstart',e=>{const t=e.target;if(t.closest('.grab')||t.closest('.sh-head')&&!t.closest('button'))y0=e.touches[0].clientY;else y0=null;},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;const dy=e.touches[0].clientY-y0;if(dy>0)sh.style.transform=`translateY(${dy}px)`;},{passive:true});
  sh.addEventListener('touchend',e=>{if(y0==null)return;const dy=(e.changedTouches[0].clientY-y0);sh.style.transform='';y0=null;if(dy>90)closeSheet();});
})();

/* ---------- start ---------- */
(async()=>{
  S=await loadState();
  if(!S.settings.pid&&liveProfiles().length)S.settings.pid=liveProfiles()[0].id;
  rebuildPersonal();render();
  await loadDb(false);
  if(VIEW.tab==='foods')render();
  if(S.sync.on){autoSync();setInterval(()=>{if(document.visibilityState==='visible')autoSync();},60000);}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){
    if(VIEW.day!==today()&&!sheetOpen()&&VIEW._lastToday&&VIEW.day===VIEW._lastToday){VIEW.day=today();render();}
    VIEW._lastToday=today();if(S.sync.on)autoSync();}});
  VIEW._lastToday=today();
  window.addEventListener('online',()=>{if(S.sync.on)autoSync();});
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();
</script>
</body>
